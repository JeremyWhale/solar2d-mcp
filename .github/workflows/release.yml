name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked

      - name: Check it answers MCP requests
        shell: bash
        run: |
          (printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 5) \
            | target/release/solar2d-mcp.exe > mcp_out.txt
          cat mcp_out.txt
          grep -q '"name":"solar2d-mcp"' mcp_out.txt
          for t in run_project read_logs screenshot tap drag touch_down touch_up type_text answer_alert wait_for display_tree eval_lua; do
            grep -q "\"name\":\"$t\"" mcp_out.txt || { echo "missing tool $t"; exit 1; }
          done

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if (-not $v.StartsWith("v")) { $v = "dev" }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/solar2d-mcp.exe dist/
          Compress-Archive -Path target/release/solar2d-mcp.exe, README.md, LICENSE -DestinationPath "dist/solar2d-mcp-$v-windows-x64.zip"
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: solar2d-mcp-windows-x64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then flag=(--notes-file "$notes"); else flag=(--generate-notes); fi
          gh release create "${{ github.ref_name }}" dist/* --title "solar2d-mcp ${{ github.ref_name }}" "${flag[@]}"
