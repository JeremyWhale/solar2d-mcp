[package]
name = "solar2d-mcp"
version = "0.2.0"
license = "MIT"
description = "MCP server for the Solar2D Simulator: run, watch and drive Solar2D projects from an AI agent"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }

[target."cfg(windows)".dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
winreg = "0.56.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
